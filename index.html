<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quimera &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --text-main: #0f172a;
            --primary: #0f766e;
            --primary-hover: #115e59;
            --accent: #c88b32;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* CAPA CRT SCANLINES Y ABERRACIÓN CROMÁTICA EXTREMA */
        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.015), rgba(0, 0, 255, 0.04));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.7;
        }

        /* Canvas para Partículas con Física de Destrucción */
        #destruction-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2500;
        }

        /* Capa de luz reactiva exclusiva para el movimiento del puntero del ratón */
        .cursor-light-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 400px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.18), rgba(200, 139, 50, 0.1) 45%, transparent 80%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .cursor-light-glow.visible {
            opacity: 1;
        }

        /* Capa de fondo estática con soporte de glitch de entrada[cite: 5] */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.00), rgba(15, 23, 42, 0.00)), url('Quimera_Ecosistema01.webp');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            opacity: 0;
            transition: opacity 1200ms ease;
        }

        #bg-layer.bg-glitch-active {
            animation: bgGlitchAnim 0.35s steps(2, end) 3 both;
        }

        @keyframes bgGlitchAnim {
            0% { filter: hue-rotate(0deg) contrast(100%); transform: translate(0); }
            20% { filter: hue-rotate(90deg) contrast(220%) invert(15%); transform: translate(-8px, 4px); }
            40% { filter: hue-rotate(-90deg) contrast(180%); transform: translate(8px, -4px); }
            60% { filter: invert(30%) contrast(250%); transform: translate(-4px, 2px); }
            80% { filter: hue-rotate(45deg) contrast(150%); transform: translate(4px, -2px); }
            100% { filter: none; transform: translate(0); }
        }

        #bg-layer.bg-skipping-active {
            animation: bgFrameSkipAnim 0.25s steps(3, jump-none) 1 both;
        }

        @keyframes bgFrameSkipAnim {
            0% { filter: contrast(120%) brightness(100%); transform: translate(0, 0); }
            30% { filter: invert(20%) hue-rotate(180deg) contrast(200%); transform: translate(6px, -4px); }
            60% { filter: brightness(150%) saturate(200%); transform: translate(-6px, 4px); }
            90% { filter: grayscale(80%) contrast(150%); transform: translate(2px, -2px); }
            100% { filter: none; transform: translate(0, 0); }
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1000ms ease;
        }

        body.blurred-page {
            pointer-events: none;
        }
        body.blurred-page #intro-overlay {
            opacity: 1;
            background-color: #ffffff;
            transition: opacity 500ms ease, background-color 500ms ease;
        }

        .top-bar, header {
            opacity: 0;
            transition: opacity 500ms ease;
        }

        .brand-logo {
            transition: opacity 500ms ease;
        }

        .top-bar {
            background-color: rgba(11, 19, 41, 0.0);
            padding: 0.85rem 2rem;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .top-bar-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease, opacity 500ms ease;
        }

        .brand-logo:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            gap: 1.25rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(0.75rem, 1.2vw, 0.9rem);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        #audio-toggle, #fullscreen-toggle {
            background: rgba(200, 139, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 500ms ease;
        }
        #audio-toggle:hover, #fullscreen-toggle:hover {
            background: var(--accent);
            color: #ffffff;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .ecosistema-title {
            position: absolute;
            top: 12vh;
            left: 50.5%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.5rem, 4vw, 4rem);
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8), 2px 0 rgba(255,0,85,0.7), -2px 0 rgba(0,229,255,0.7);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            pointer-events: auto;
            margin: 0;
            color: #ffffff;
            opacity: 0;
        }

        header h1 {
            position: absolute;
            top: 60vh;
            left: 50.5%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 8.5vw, 7rem);
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8), 3px 0 rgba(255,0,85,0.8), -3px 0 rgba(0,229,255,0.8);
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            pointer-events: auto;
            margin: 0;
            color: #ffffff;
            opacity: 0;
        }

        header p {
            position: absolute;
            top: calc(60vh + 6.25rem + 1.0rem);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #ffffff;
            font-weight: 700;
            width: 100%;
            max-width: 1000px;
            margin: 0;
            text-align: center;
            pointer-events: auto;
            -webkit-text-stroke: 1px #000000;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4), 4px 4px 10px rgba(0, 0, 0, 0.8);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(226, 232, 240, 0.85) 100%);
            -webkit-background-clip: text;
            opacity: 0;
        }

        footer.laser-burn-effect {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            text-align: center;
            padding: 0.4rem 2rem;
            background-color: rgba(11, 19, 41, 0.2);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            clip-path: inset(0 100% 0 0);
            opacity: 0;
        }

        .laser-burn-effect.active-laser {
            opacity: 1;
            animation: hyperLaserReveal 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
        }

        .laser-burn-effect.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
        }

        .laser-burn-effect.active-laser::before {
            content: '';
            position: absolute;
            top: -30px;
            bottom: -30px;
            left: 0;
            width: 16px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #c88b32 80%, transparent 100%);
            box-shadow: 0 0 35px #38bdf8, 0 0 70px #fffbeb, 0 0 100px #c88b32, inset 0 0 15px #ffffff;
            animation: hyperLaserBarMove 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 15;
            filter: blur(0.5px);
        }

        .laser-burn-effect.active-laser::after {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 120%;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(56,189,248,0.6) 30%, rgba(200,139,50,0.3) 60%, transparent 100%);
            mix-blend-mode: color-dodge;
            animation: hyperLaserSparksWave 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 12;
        }

        @keyframes hyperLaserReveal {
            0% {
                clip-path: inset(0 100% 0 0);
                filter: brightness(4) contrast(200%) drop-shadow(0 0 30px rgba(56, 189, 248, 1));
            }
            50% {
                filter: brightness(2.5) contrast(150%) drop-shadow(0 0 15px rgba(200, 139, 50, 0.9));
            }
            100% {
                clip-path: inset(0 0 0 0);
                filter: brightness(1) contrast(100%) drop-shadow(0 0 0px transparent);
            }
        }

        @keyframes hyperLaserBarMove {
            0% {
                left: 0%;
                opacity: 1;
                transform: scaleY(1.8) skewX(-15deg);
            }
            50% {
                transform: scaleY(2.2) skewX(5deg);
            }
            90% {
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
                transform: scaleY(0.5) skewX(0deg);
            }
        }

        @keyframes hyperLaserSparksWave {
            0% {
                opacity: 1;
                clip-path: inset(0 100% 0 0);
            }
            100% {
                opacity: 0;
                clip-path: inset(0 0 0 0);
            }
        }

        .glitch-slice-active {
            animation: sliceGlitchMaster 0.35s steps(2, end) 3 both;
        }

        .glitch-slice-active::before,
        .glitch-slice-active::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glitch-slice-active::before {
            left: 4px;
            text-shadow: -3px 0 #ff0055, 0 3px #00e5ff;
            clip-path: inset(0 0 52% 0);
            animation: sliceTopShift 0.35s steps(2, end) 3 both;
        }

        .glitch-slice-active::after {
            left: -4px;
            text-shadow: 3px 0 #00e5ff, 0 -3px #ff0055;
            clip-path: inset(48% 0 0 0);
            animation: sliceBottomShift 0.35s steps(2, end) 3 both;
        }

        @keyframes sliceGlitchMaster {
            0% { transform: translateX(-50%) translate(0); filter: hue-rotate(0deg); }
            20% { transform: translateX(-50%) translate(-12px, 6px); filter: contrast(220%) hue-rotate(90deg); }
            40% { transform: translateX(-50%) translate(10px, -6px); filter: contrast(180%) invert(20%); }
            60% { transform: translateX(-50%) translate(-8px, 4px); filter: contrast(250%) hue-rotate(-90deg); }
            80% { transform: translateX(-50%) translate(9px, -4px); filter: contrast(150%); }
            100% { transform: translateX(-50%) translate(0); filter: none; }
        }

        @keyframes sliceTopShift {
            0%, 100% { transform: translate(0, 0); }
            30% { transform: translate(-20px, -5px); }
            60% { transform: translate(14px, 4px); }
        }

        @keyframes sliceBottomShift {
            0%, 100% { transform: translate(0, 0); }
            30% { transform: translate(20px, 5px); }
            60% { transform: translate(-14px, -4px); }
        }

        .hologram-mode {
            animation: hologramFlicker 4s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6), 0 0 30px rgba(200, 139, 50, 0.4), 4px 4px 10px rgba(0, 0, 0, 0.8), 2px 0 #ff0055, -2px 0 #00e5ff;
        }

        .card-hologram-glow {
            animation: cardHologramFlicker 4s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(200, 139, 50, 0.2), var(--shadow);
        }

        @keyframes cardHologramFlicker {
            0%, 100% { box-shadow: 0 0 12px rgba(56, 189, 248, 0.4), 0 0 25px rgba(200, 139, 50, 0.2), var(--shadow); border-color: rgba(255, 255, 255, 0.8); }
            33% { box-shadow: 0 0 6px rgba(200, 139, 50, 0.3), var(--shadow); border-color: rgba(255, 255, 255, 0.5); }
            35% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.6), var(--shadow); border-color: rgba(56, 189, 248, 0.9); }
            67% { box-shadow: 0 0 8px rgba(56, 189, 248, 0.3), var(--shadow); border-color: rgba(255, 255, 255, 0.6); }
            70% { box-shadow: 0 0 15px rgba(200, 139, 50, 0.5), var(--shadow); border-color: rgba(200, 139, 50, 0.8); }
        }

        @keyframes hologramFlicker {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5)); }
            33% { opacity: 0.92; filter: drop-shadow(0 0 4px rgba(200, 139, 50, 0.3)); }
            35% { opacity: 0.98; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.7)); }
            67% { opacity: 0.88; filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.4)); }
            70% { opacity: 1; filter: drop-shadow(0 0 10px rgba(200, 139, 50, 0.6)); }
        }

        header h1 a {
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        @keyframes quimeraSequentialWave {
            0%     { color: #ffffff; }
            3.57%  { color: #c88b32; }
            25%    { color: #c88b32; }
            28.57% { color: #ffffff; }
            50%    { color: #ffffff; }
            53.57% { color: #c88b32; }
            75%    { color: #c88b32; }
            78.57% { color: #ffffff; }
            100%   { color: #ffffff; }
        }

        #quimera-link.active-wave .char-q { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 0ms; }
        #quimera-link.active-wave .char-u { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 80.85ms; }
        #quimera-link.active-wave .char-i { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 161.70ms; }
        #quimera-link.active-wave .char-m { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 242.55ms; }
        #quimera-link.active-wave .char-e { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 323.40ms; }
        #quimera-link.active-wave .char-r { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 404.25ms; }
        #quimera-link.active-wave .char-a { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 485.10ms; }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .info-card {
            opacity: 0;
            pointer-events: auto;
            position: absolute;
            text-decoration: none;
            background-color: transparent;
            border: 1px solid #ffffff;
            border-radius: 12px;
            padding: 0.7rem 0.8rem;
            width: 20vw;
            max-width: 350px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, opacity 1200ms ease;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            text-align: center;
        }

        .info-card h2 {
            opacity: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.4rem, 2.0vw, 1.6rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #ffffff;
            -webkit-text-stroke: 0.5px #000000;
            text-shadow: 0 0 1px #ffffff, 0 0 1px #ffffff;
            transition: color 0.3s ease, -webkit-text-stroke 0.3s ease, text-shadow 0.3s ease, opacity 0.3s ease;
        }

        .info-card:hover h2 {
            opacity: 1;
            color: var(--accent);
            -webkit-text-stroke: 0.5px #000000;
            text-shadow: none;
        }

        .info-card p {
            opacity: 0;
            color: #ffffff;
            font-size: clamp(1.1rem, 1.5vw, 1.25rem);
            font-weight: 600;
            -webkit-text-stroke: 0.5px #000000;
            transition: color 0.3s ease, -webkit-text-stroke: 0.5px #000000, opacity 0.3s ease;
        }

        .info-card:hover p {
            opacity: 1;
            color: #000000;
            -webkit-text-stroke: 0;
        }

        .card-1 { top: 15vh; left: 03vw; width: 15vw; max-width: 350px; padding: 0.7rem 0.7rem; transform: translateX(-10%) translateY(-25%); }
        .card-1:hover { box-shadow: var(--shadow-lg); background-color: #ffffff; transform: translateX(-10%) translateY(-25%) translateY(-6px); }

        .card-2 { top: 46.5vh; left: 02.25vw; width: 14vw; max-width: 350px; padding: 0.7rem 0.7rem; transform: translateX(-10%) translateY(-25%); }
        .card-2:hover { box-shadow: var(--shadow-lg); background-color: #ffffff; transform: translateX(-10%) translateY(-25%) translateY(-6px); }

        .card-3 { top: 81.5vh; left: 49%; width: 12vw; max-width: 350px; padding: 0.3rem 0.7rem; gap: 0rem; transform: translateX(-50%) translateY(55%); }

        .card-4 { top: 46.5vh; right: 01.75vw; width: 14.5vw; max-width: 350px; padding: 0.7rem 0.7rem; transform: translateX(10%) translateY(-25%); }

        .card-5:hover { box-shadow: var(--shadow-lg); background-color: #ffffff; transform: translateX(10%) translateY(-25%) translateY(-6px); }

        #image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 400ms ease;
        }

        #image-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        #image-modal a {
            display: inline-block;
            line-height: 0;
            text-decoration: none;
        }

        @keyframes heartbeat-106bpm {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        #image-modal img {
            max-width: 75vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 400ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        #image-modal.active img {
            transform: scale(1);
        }

        #image-modal img:hover {
            animation: heartbeat-106bpm 0.5660377358490566s infinite ease-in-out;
        }

        .close-modal {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            color: #ffffff;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 30001;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .close-modal:hover {
            background: #ffffff;
            color: #000000;
        }

        @media (max-width: 1200px) {
            body {
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            #bg-layer {
                height: 100%;
                background-attachment: scroll;
            }

            .top-bar {
                position: relative;
                background-color: rgba(11, 19, 41, 0.85);
                backdrop-filter: blur(6px);
                padding: 0.75rem 1rem;
            }

            .top-bar-container {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }

            .nav-links {
                justify-content: center;
                gap: 0.8rem;
                flex-wrap: wrap;
            }

            header {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                height: auto;
                transform: none;
                padding: 2rem 1rem 1.5rem 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                text-align: center;
            }

            .ecosistema-title, header h1, header p {
                position: relative !important;
                top: auto !important;

                transform: none !important;

                max-width: 100% !important;
            }

            .info-card {
                position: relative !important;

                right: auto !important;
                bottom: auto !important;
                transform: none !important;
                width: 100% !important;
                max-width: 420px !important;

                background-color: rgba(15, 23, 42, 0.75);
                backdrop-filter: blur(4px);
            }

            .info-card:hover {
                transform: translateY(-4px) !important;

            footer.laser-burn-effect {
                position: relative !important;
                margin-top: 1rem;
                padding: 1rem;
                bottom: auto !important;
                left: auto !important;
            }
        }
    </style>
</head>
<body>

    <!-- Capa CRT Scanlines y Aberración Cromática Extrema -->

    <!-- Canvas para el Sistema de Partículas con Física de Destrucción -->

    <audio id="bg-music" src="Tango_Futuro_(Lado_B).mp3" loop preload="auto"></audio>
    
    <div id="bg-layer"></div>
    <div class="cursor-light-glow" id="cursor-light-glow"></div>
    <div id="intro-overlay"></div>

    <div id="image-modal">
        <button class="close-modal">&times;</button>

    <nav class="top-bar">

            <ul class="nav-links">
                <li><a href="#" id="audio-toggle"><span style="color: #ffffff;">🎵</span> Música: OFF</a></li>
                <li><a href="#" id="fullscreen-toggle">⛶ Pantalla Completa</a></li>
            </ul>
        </div>
    </nav>

    <header>
        <div class="ecosistema-title" data-text="ECOSISTEMA">ECOSISTEMA</div>
        <h1 data-text="QUIMERA"><a href="#" id="quimera-link"><span class="quimera-letter char-q">Q</span><span class="quimera-letter char-u">U</span><span class="quimera-letter char-i">I</span><span class="quimera-letter char-m">M</span><span class="quimera-letter char-e">E</span><span class="quimera-letter char-r">R</span><span class="quimera-letter char-a">A</span></a></h1>
        <p data-text="Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.">Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.</p>
    </header>

    <main class="container">
        <a href="https://quimerac3.github.io/QuimeraC3-Q-01QE/" class="info-card card-1" data-text="QUIMERA">
            <h2>QUIMERA</h2>

            <p>Aquí es donde creamos.</p>

    <footer class="laser-burn-effect" id="main-footer">
        <p id="footer-text" data-text="&bull; &copy; 2026 Instituto Quimera. &bull; Centro de Investigación, Docencia, Servicio y Difusión. &bull; Dr.C. Cesar Cerezo Camacho. &bull; Todos los derechos reservados. &bull;"></p>
    </footer>

    <script>
        // MOTOR DE PARTÍCULAS CON FÍSICA DE DESTRUCCIÓN
        const canvas = document.getElementById('destruction-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeDestructionCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeDestructionCanvas);
        resizeDestructionCanvas();

        function triggerDestructionPhysics(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const colors = ['#c88b32', '#38bdf8', '#ffffff', '#0f766e', '#ff0055'];

            // Generar fragmentos con física de explosión y gravedad
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2, // impulso hacia arriba inicial
                    size: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1.0,
                    decay: Math.random() * 0.02 + 0.015,
                    gravity: 0.35,
                    friction: 0.96,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 15
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.vx *= p.friction;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.vRot;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        // Vincular físicas de destrucción al hacer clic en las tarjetas del ecosistema
        document.querySelectorAll('.info-card').forEach(card => {
            card.addEventListener('click', (e) => {
                triggerDestructionPhysics(e);
            });
        });

        // CONTROL DE MOVIMIENTO DEL CURSOR
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });

        function irAInicio() {
            window.location.replace('https://quimerac3.github.io/');
        }

        history.pushState({ page: 'ecosistema' }, "", window.location.href);

        ['click', 'touchstart', 'keydown', 'scroll'].forEach(evt => {
            window.addEventListener(evt, function () {
                history.pushState({ page: 'ecosistema' }, "", window.location.href);
            }, { once: true });
        });

        window.addEventListener('popstate', function () {
            irAInicio();
        });

        window.addEventListener('keydown', function (e) {
            if (e.altKey && (e.key === 'ArrowLeft' || e.keyCode === 37)) {
                e.preventDefault();
                e.stopPropagation();
                irAInicio();
            }
        }, true);

        const quimeraLink = document.getElementById('quimera-link');
        quimeraLink.addEventListener('mouseenter', () => quimeraLink.classList.add('active-wave'));
        quimeraLink.addEventListener('mouseleave', () => quimeraLink.classList.remove('active-wave'));

        const imageModal = document.getElementById('image-modal');
        const closeModal = document.querySelector('.close-modal');

        quimeraLink.addEventListener('click', (e) => {
            e.preventDefault(); 
            imageModal.classList.add('active');
        });

        closeModal.addEventListener('click', () => imageModal.classList.remove('active'));
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) imageModal.classList.remove('active');
        });

        const music = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                audioToggle.innerHTML = '<span style="color: #ffffff;">🎵</span> Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    audioToggle.innerHTML = '<span style="color: #ffffff;">🎶</span> Música: ON';
                    isMusicPlaying = true;
                }).catch(err => console.log(err));
            }
        });

        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        fullscreenToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        function iniciarFrameSkippingAmbiental() {
            const bgLayer = document.getElementById('bg-layer');

            function dispararSkip() {
                if (!document.hidden && bgLayer.style.opacity === '1') {
                    bgLayer.classList.add('bg-skipping-active');
                    setTimeout(() => {
                        bgLayer.classList.remove('bg-skipping-active');
                    }, 250);
                }
                const tiempoSiguiente = Math.random() * 8000 + 6000;
                setTimeout(dispararSkip, tiempoSiguiente);
            }

            setTimeout(dispararSkip, 7000);
        }

        function runEcosystemEntrance() {
            const overlay = document.getElementById('intro-overlay');
            const bgLayer = document.getElementById('bg-layer');
            const cursorGlow = document.getElementById('cursor-light-glow');

            function iniciarAnimaciones() {
                overlay.style.opacity = '0';

                bgLayer.style.opacity = '1';
                cursorGlow.classList.add('visible');
                bgLayer.classList.add('bg-glitch-active');
                setTimeout(() => {
                    bgLayer.classList.remove('bg-glitch-active');
                }, 1050);

                const topBar = document.querySelector('.top-bar');
                topBar.style.opacity = '1';
                topBar.classList.add('glitch-slice-active');
                setTimeout(() => {
                    topBar.classList.remove('glitch-slice-active');
                }, 1050);

                const cards = ['.card-1', '.card-2', '.card-3', '.card-4', '.card-5'];
                cards.forEach(cardSel => {
                    const card = document.querySelector(cardSel);
                    if (!card) return;
                    card.style.opacity = '1';
                    card.classList.add('glitch-slice-active');
                    setTimeout(() => {
                        card.classList.remove('glitch-slice-active');
                        card.classList.add('card-hologram-glow');
                    }, 1050);
                });

                const brandLogo = document.querySelector('.brand-logo');
                const textLogo = brandLogo.dataset.text;
                let iLogo = 0;
                function typeBrandLogo() {
                    if (iLogo <= textLogo.length) {
                        brandLogo.innerHTML = textLogo.substring(0, iLogo);
                        iLogo++;
                        setTimeout(typeBrandLogo, 25);
                    }
                }
                typeBrandLogo();

                document.querySelector('header').style.opacity = '1';

                function ejecutarGlitchSupremo(selector, delay) {
                    setTimeout(() => {
                        const el = document.querySelector(selector);
                        if (!el) return;
                        el.style.opacity = '1';
                        el.classList.add('glitch-slice-active');
                        
                        setTimeout(() => {
                            el.classList.remove('glitch-slice-active');
                            el.classList.add('hologram-mode');
                        }, 1050);
                    }, delay);
                }

                ejecutarGlitchSupremo('.ecosistema-title', 1400);
                ejecutarGlitchSupremo('header h1', 2650);
                ejecutarGlitchSupremo('header p', 3900);

                setTimeout(async () => {
                    const mainFooter = document.getElementById('main-footer');
                    const footerText = document.getElementById('footer-text');
                    footerText.textContent = footerText.dataset.text.replace('2026', new Date().getFullYear());
                    mainFooter.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 1200));
                    mainFooter.classList.remove('active-laser');
                    mainFooter.classList.add('revealed', 'hologram-mode');
                }, 5400);

                iniciarFrameSkippingAmbiental();
            }

            const imgFondo = new Image();
            imgFondo.src = 'Quimera_Ecosistema01.webp';

            if (imgFondo.complete) {
                requestAnimationFrame(iniciarAnimaciones);
            } else {
                imgFondo.onload = () => requestAnimationFrame(iniciarAnimaciones);
                imgFondo.onerror = () => requestAnimationFrame(iniciarAnimaciones);
            }
        }

        window.addEventListener('DOMContentLoaded', runEcosystemEntrance);

        const allLinks = document.querySelectorAll('a[href]');
        allLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.id === 'audio-toggle' || this.id === 'fullscreen-toggle' || this.id === 'quimera-link') return;
                const href = this.getAttribute('href');
                if (href.startsWith('#')) return;

                e.preventDefault(); 
                const targetUrl = this.href;

                if (targetUrl.includes('https://quimerac3.github.io/QuimeraC3-Q-MDQ/')) {
                    const overlay = document.getElementById('intro-overlay');
                    overlay.style.zIndex = '40000';
                    overlay.style.backgroundColor = '#000000';
                    overlay.style.opacity = '1';

                    setTimeout(() => { window.location.href = targetUrl; }, 1000);
                    return;
                }

                document.body.classList.add('blurred-page');
                imageModal.classList.remove('active');

                document.querySelectorAll('.top-bar, header, .container').forEach(el => {
                    el.style.transition = 'opacity 800ms ease';
                    el.style.opacity = '0';
                });
                document.getElementById('bg-layer').style.opacity = '0';
                document.getElementById('cursor-light-glow').style.opacity = '0';

                const overlay = document.getElementById('intro-overlay');
                overlay.style.zIndex = '40000';
                overlay.style.backgroundColor = '#000000';
                overlay.style.opacity = '1';

                setTimeout(() => {
                    overlay.style.backgroundColor = '#ffffff';
                }, 600);

                setTimeout(() => { window.location.href = targetUrl; }, 1200);
            });
        });
    </script>
