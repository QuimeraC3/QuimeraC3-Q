<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quimera &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --text-main: #0f172a;
            --primary: #0f766e;
            --primary-hover: #115e59;
            --accent: #c88b32;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }

        /* CAPA CRT SCANLINES */
        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.65;
        }

        .cursor-light-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle 400px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.18), rgba(200, 139, 50, 0.1) 45%, transparent 80%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .cursor-light-glow.visible { opacity: 1; }

        #bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -3;
            background: linear-gradient(rgba(15, 23, 42, 0.00), rgba(15, 23, 42, 0.00)), url('Quimera_Ecosistema.webp');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            opacity: 0;
            transition: opacity 1200ms ease;
        }

        #bg-top-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            background: url('QuimeraC3-Q1.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0;
            transition: opacity 1200ms ease, transform 0.2s ease;
            pointer-events: none;
            transform-origin: center center;
        }

        /* RECUADRO SELECCIONABLE INTERACTIVO (HOTSPOT) */
        #hotspot-box {
            position: fixed;
            top: 200px;
            left: 600px;
            width: 380px;
            height: 325px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 5;
            pointer-events: auto;
            text-decoration: none;
        }

        /* ANIMACIÓN DE LATIDO A 106 LPM */
        @keyframes heartbeat106 {
            0% { transform: scale(1); }
            25% { transform: scale(1.035); }
            40% { transform: scale(1); }
            60% { transform: scale(1.025); }
            100% { transform: scale(1); }
        }

        #bg-top-layer.heartbeat-active {
            animation: heartbeat106 0.566s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        #bg-layer.bg-glitch-active {
            animation: bgGlitchAnim 0.35s steps(2, end) 1 both;
        }

        @keyframes bgGlitchAnim {
            0% { filter: hue-rotate(0deg) contrast(100%); transform: translate(0); }
            20% { filter: hue-rotate(90deg) contrast(220%) invert(15%); transform: translate(-8px, 4px); }
            40% { filter: hue-rotate(-90deg) contrast(180%); transform: translate(8px, -4px); }
            60% { filter: invert(30%) contrast(250%); transform: translate(-4px, 2px); }
            80% { filter: hue-rotate(45deg) contrast(150%); transform: translate(4px, -2px); }
            100% { filter: none; transform: translate(0); }
        }

        #intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1000ms ease, background-color 1000ms ease;
        }

        body.blurred-page { pointer-events: none; }
        body.blurred-page #intro-overlay {
            opacity: 1;
            background-color: #ffffff;
            transition: opacity 500ms ease, background-color 500ms ease;
        }

        /* NAVEGACIÓN SUPERIOR */
        .top-bar {
            background-color: rgba(11, 19, 41, 0.0);
            padding: 0.85rem 2rem;
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            z-index: 100;
        }

        .top-bar-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s ease;
        }

        .brand-logo:hover { color: #38bdf8; text-decoration: underline; }

        .nav-links {
            display: flex;
            gap: 1.25rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(0.75rem, 1.2vw, 0.9rem);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover { color: #38bdf8; }

        #audio-toggle, #fullscreen-toggle {
            display: inline-block;
            background: rgba(56, 189, 248, 0.22);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #ffffff;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
            transition: opacity 500ms ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #audio-toggle:hover, #fullscreen-toggle:hover {
            background: rgba(56, 189, 248, 0.5);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        header {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .ecosistema-title {
            position: absolute;
            top: 11vh; left: 50.5%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.5rem, 4vw, 4rem);
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            pointer-events: auto;
            color: #ffffff;
            opacity: 0;
        }

        header h1 {
            position: absolute;
            top: 61vh; left: 50.5%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 8.5vw, 7rem);
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8);
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            pointer-events: auto;
            color: #ffffff;
            opacity: 0;
        }

        header p {
            position: absolute;
            top: calc(61vh + 6.25rem + 1.0rem);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #ffffff;
            font-weight: 700;
            width: 100%;
            max-width: 1000px;
            text-align: center;
            pointer-events: auto;
            -webkit-text-stroke: 1px #000000;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4), 4px 4px 10px rgba(0, 0, 0, 0.8);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(226, 232, 240, 0.85) 100%);
            -webkit-background-clip: text;
            opacity: 0;
        }

        .laser-burn-effect {
            opacity: 0;
            clip-path: inset(0 100% 0 0);
            position: relative;
        }

        .laser-burn-effect.active-laser {
            opacity: 1;
            animation: hyperLaserReveal 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
        }

        .laser-burn-effect.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
        }

        .laser-burn-effect.active-laser::before {
            content: '';
            position: absolute;
            top: -30px; bottom: -30px; left: 0;
            width: 16px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #c88b32 80%, transparent 100%);
            box-shadow: 0 0 35px #38bdf8, 0 0 70px #fffbeb, 0 0 100px #c88b32, inset 0 0 15px #ffffff;
            animation: hyperLaserBarMove 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 15;
            filter: blur(0.5px);
        }

        @keyframes hyperLaserReveal {
            0% { clip-path: inset(0 100% 0 0); filter: brightness(4) contrast(200%); }
            100% { clip-path: inset(0 0 0 0); filter: brightness(1) contrast(100%); }
        }

        @keyframes hyperLaserBarMove {
            0% { left: 0%; opacity: 1; transform: scaleY(1.8) skewX(-15deg); }
            100% { left: 100%; opacity: 0; transform: scaleY(0.5) skewX(0deg); }
        }

        footer.laser-burn-effect {
            position: absolute !important;
            bottom: 0 !important; left: 0 !important;
            width: 100% !important;
            text-align: center;
            padding: 0.4rem 2rem;
            background-color: rgba(11, 19, 41, 0.2);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .glitch-slice-active {
            animation: sliceGlitchMaster 0.35s steps(2, end) 1 both;
        }

        @keyframes sliceGlitchMaster {
            0% { transform: translateX(-50%) translate(0); filter: hue-rotate(0deg); }
            50% { transform: translateX(-50%) translate(-12px, 6px); filter: contrast(220%) hue-rotate(90deg); }
            100% { transform: translateX(-50%) translate(0); filter: none; }
        }

        .hologram-mode {
            animation: hologramNeonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes hologramNeonGlow {
            0% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.7), 0 0 20px rgba(15, 118, 110, 0.5), 3px 3px 8px rgba(0, 0, 0, 0.8); }
            50% { text-shadow: 0 0 20px rgba(56, 189, 248, 1), 0 0 35px rgba(56, 189, 248, 0.8), 0 0 50px rgba(200, 139, 50, 0.6), 3px 3px 8px rgba(0, 0, 0, 0.8); }
            100% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.7), 0 0 20px rgba(15, 118, 110, 0.5), 3px 3px 8px rgba(0, 0, 0, 0.8); }
        }

        .card-hologram-glow {
            animation: cardHologramFlicker 4s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(200, 139, 50, 0.2), var(--shadow);
        }

        @keyframes cardHologramFlicker {
            0%, 100% { box-shadow: 0 0 12px rgba(56, 189, 248, 0.4), 0 0 25px rgba(200, 139, 50, 0.2), var(--shadow); border-color: rgba(255, 255, 255, 0.8); }
            50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.6), var(--shadow); border-color: rgba(56, 189, 248, 0.9); }
        }

        header h1 a { color: #ffffff; text-decoration: none; display: inline-block; }
        .quimera-letter { display: inline-block; color: #ffffff; }

        @keyframes quimeraSequentialWave {
            0%, 28.57%, 50%, 78.57%, 100% { color: #ffffff; }
            3.57%, 25%, 53.57%, 75% { color: #c88b32; }
        }

        #quimera-link.active-wave .char-q { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 0ms; }
        #quimera-link.active-wave .char-u { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 80.85ms; }
        #quimera-link.active-wave .char-i { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 161.70ms; }
        #quimera-link.active-wave .char-m { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 242.55ms; }
        #quimera-link.active-wave .char-e { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 323.40ms; }
        #quimera-link.active-wave .char-r { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 404.25ms; }
        #quimera-link.active-wave .char-a { animation: quimeraSequentialWave 2.264s infinite linear; animation-delay: 485.10ms; }

        .container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .info-card {
            opacity: 0;
            pointer-events: auto;
            position: absolute;
            text-decoration: none;
            background-color: transparent;
            border: 1px solid #ffffff;
            border-radius: 12px;
            padding: 0.7rem 0.8rem;
            width: 20vw; max-width: 350px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, opacity 1200ms ease;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            text-align: center;
        }

        .info-card h2 {
            opacity: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.4rem, 2.0vw, 1.6rem);
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 0.5px #000000;
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .info-card:hover h2 { opacity: 1; color: var(--accent); }

        .info-card p {
            opacity: 0;
            color: #ffffff;
            font-size: clamp(1.1rem, 1.5vw, 1.25rem);
            font-weight: 600;
            -webkit-text-stroke: 0.5px #000000;
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .info-card:hover p { opacity: 1; color: #000000; -webkit-text-stroke: 0; }

        .card-1 { top: 15vh; left: 03vw; width: 15vw; transform: translateX(-10%) translateY(-25%); }
        .card-1:hover { background-color: #ffffff; transform: translateX(-10%) translateY(-25%) translateY(-6px); }

        .card-2 { top: 46.5vh; left: 02.25vw; width: 14vw; transform: translateX(-10%) translateY(-25%); }
        .card-2:hover { background-color: #ffffff; transform: translateX(-10%) translateY(-25%) translateY(-6px); }

        .card-3 { top: 81.5vh; left: 49%; width: 12vw; padding: 0.3rem 0.7rem; transform: translateX(-50%) translateY(55%); }
        .card-3:hover { background-color: #ffffff; transform: translateX(-50%) translateY(55%) translateY(-6px); }

        .card-4 { top: 46.5vh; right: 01.75vw; width: 14.5vw; transform: translateX(10%) translateY(-25%); }
        .card-4:hover { background-color: #ffffff; transform: translateX(10%) translateY(-25%) translateY(-6px); }

        .card-5 { top: 15vh; right: 02.5vw; width: 17.5vw; transform: translateX(10%) translateY(-25%); }
        .card-5:hover { background-color: #ffffff; transform: translateX(10%) translateY(-25%) translateY(-6px); }

        @media (max-width: 1200px) {
            body { height: auto; overflow-y: auto; overflow-x: hidden; }
            #bg-layer, #bg-top-layer { height: 100%; background-attachment: scroll; }
            .top-bar { position: relative; background-color: rgba(11, 19, 41, 0.85); padding: 0.75rem 1rem; }
            .top-bar-container { flex-direction: column; gap: 0.5rem; text-align: center; }
            header { position: relative; height: auto; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
            .ecosistema-title, header h1, header p { position: relative !important; top: auto !important; left: auto !important; transform: none !important; width: 100% !important; max-width: 100% !important; }
            .container { position: relative; height: auto; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 0 1rem 2rem 1rem; }
            .info-card { position: relative !important; width: 100% !important; max-width: 420px !important; margin: 0 auto; background-color: rgba(15, 23, 42, 0.75); }
            footer.laser-burn-effect { position: relative !important; margin-top: 1rem; padding: 1rem; }
        }
    </style>
</head>
<body>

    <div class="crt-scanlines"></div>

    <audio id="bg-music" src="Tango_Futuro_(Lado_B).mp3" loop preload="auto"></audio>
    
    <!-- CAPAS DE FONDO DUALES -->
    <div id="bg-layer"></div>
    <div id="bg-top-layer"></div>

    <!-- RECUADRO SELECCIONABLE INTERACTIVO (HOTSPOT) -->
    <a href="https://quimerac3.github.io/QuimeraC3-GAAV/" id="hotspot-box"></a>

    <div class="cursor-light-glow" id="cursor-light-glow"></div>
    <div id="intro-overlay"></div>

    <nav class="top-bar">
        <div class="top-bar-container">
            <a href="https://quimerac3.github.io/" class="brand-logo laser-burn-effect" id="brand-logo" data-text="QUIMERA - Inicio General"></a>
            <ul class="nav-links">
                <li><a href="#" id="audio-toggle" class="laser-burn-effect"><span style="color: #ffffff;">🎵</span> Música: OFF</a></li>
                <li><a href="#" id="fullscreen-toggle" class="laser-burn-effect">⛶ Pantalla Completa</a></li>
            </ul>
        </div>
    </nav>

    <header>
        <div class="ecosistema-title" data-text="ECOSISTEMA">ECOSISTEMA</div>
        <h1 data-text="QUIMERA"><a href="#" id="quimera-link"><span class="quimera-letter char-q">Q</span><span class="quimera-letter char-u">U</span><span class="quimera-letter char-i">I</span><span class="quimera-letter char-m">M</span><span class="quimera-letter char-e">E</span><span class="quimera-letter char-r">R</span><span class="quimera-letter char-a">A</span></a></h1>
        <p data-text="Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.">Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.</p>
    </header>

    <main class="container">
        <a href="https://quimerac3.github.io/QuimeraC3-Q-01QE/" class="info-card card-1" data-text="QUIMERA">
            <h2>QUIMERA</h2>
            <p>Esto somos.</p>
        </a>
        <a href="https://quimerac3.github.io/QuimeraC3-Q-02M/" class="info-card card-2" data-text="MISIÓN.">
            <h2>MISIÓN.</h2>
            <p>Para esto existimos.</p>
        </a>
        <a href="https://quimerac3.github.io/QuimeraC3-Q-03V/" class="info-card card-3" data-text="VISIÓN.">
            <h2>VISIÓN.</h2>
            <p>Hacia esto vamos.</p>
        </a>
        <a href="https://quimerac3.github.io/QuimeraC3-Q-04P/" class="info-card card-4" data-text="PRINCIPIOS.">
            <h2>PRINCIPIOS.</h2>
            <p>Así creamos.</p>
        </a>
        <a href="https://quimerac3.github.io/QuimeraC3-Q-05D/" class="info-card card-5" data-text="DESARROLLO.">
            <h2>DESARROLLO.</h2>
            <p>Aquí es donde creamos.</p>
        </a>
    </main>

    <footer class="laser-burn-effect" id="main-footer">
        <p id="footer-text" data-text="&bull; &copy; 2026 Instituto Quimera. &bull; Centro de Investigación, Docencia, Servicio y Difusión. &bull; Dr.C. Cesar Cerezo Camacho. &bull; Todos los derechos reservados. &bull;"></p>
    </footer>

    <script>
        // PRECARGA DE IMÁGENES
        const assetImages = [
            'Quimera_Ecosistema.webp',
            'QuimeraC3-Q1.webp'
        ];
        assetImages.forEach(src => { const img = new Image(); img.src = src; });

        // CONTROLES GENERALES, LATIDO Y ANIMACIÓN DE ENTRADA
        const music = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                audioToggle.innerHTML = '<span style="color: #ffffff;">🎵</span> Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    audioToggle.innerHTML = '<span style="color: #ffffff;">🎶</span> Música: ON';
                    isMusicPlaying = true;
                }).catch(err => console.log(err));
            }
        });

        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        fullscreenToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('mousemove', (e) => {
            document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        // EFECTO DE LATIDO A 106 LPM
        const bgTopLayer = document.getElementById('bg-top-layer');
        const hotspotBox = document.getElementById('hotspot-box');
        if (hotspotBox && bgTopLayer) {
            hotspotBox.addEventListener('mouseenter', () => bgTopLayer.classList.add('heartbeat-active'));
            hotspotBox.addEventListener('mouseleave', () => bgTopLayer.classList.remove('heartbeat-active'));
        }

        // TRANSICIÓN DIRECTA DESDE EL HOTSPOT HACIA LA GALERÍA AUDIOVISUAL (CON DESVANECIMIENTO NEGRO -> BLANCO)
        if (hotspotBox) {
            hotspotBox.addEventListener('click', (e) => {
                e.preventDefault();
                const targetUrl = hotspotBox.href;

                document.body.classList.add('blurred-page');
                document.querySelectorAll('.top-bar, header, .container, #bg-layer, #bg-top-layer, #hotspot-box, #main-footer').forEach(el => {
                    el.style.transition = 'opacity 800ms ease';
                    el.style.opacity = '0';
                });
                document.getElementById('cursor-light-glow').style.opacity = '0';

                const overlay = document.getElementById('intro-overlay');
                overlay.style.zIndex = '40000';
                overlay.style.backgroundColor = '#000000';
                overlay.style.opacity = '1';

                setTimeout(() => { overlay.style.backgroundColor = '#ffffff'; }, 600);
                setTimeout(() => { window.location.href = targetUrl; }, 1200);
            });
        }

        function runEcosystemEntrance() {
            const overlay = document.getElementById('intro-overlay');
            const bgLayer = document.getElementById('bg-layer');
            const cursorGlow = document.getElementById('cursor-light-glow');

            async function iniciarAnimaciones() {
                overlay.style.opacity = '0';
                bgLayer.style.opacity = '1';
                if (bgTopLayer) bgTopLayer.style.opacity = '1';
                cursorGlow.classList.add('visible');
                bgLayer.classList.add('bg-glitch-active');
                
                const cards = ['.card-1', '.card-2', '.card-3', '.card-4', '.card-5'];
                cards.forEach(cardSel => {
                    const card = document.querySelector(cardSel);
                    if (!card) return;
                    card.style.opacity = '1';
                    card.classList.add('glitch-slice-active');
                });

                setTimeout(() => {
                    bgLayer.classList.remove('bg-glitch-active');
                    cards.forEach(cardSel => {
                        const card = document.querySelector(cardSel);
                        if (!card) return;
                        card.classList.remove('glitch-slice-active');
                        card.classList.add('card-hologram-glow');
                    });
                }, 350);

                document.querySelector('.top-bar').style.opacity = '1';

                const brandLogo = document.getElementById('brand-logo');
                brandLogo.textContent = brandLogo.dataset.text;
                brandLogo.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 1200));
                brandLogo.classList.remove('active-laser');
                brandLogo.classList.add('revealed', 'hologram-mode');

                const audioToggleBtn = document.getElementById('audio-toggle');
                audioToggleBtn.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 1200));
                audioToggleBtn.classList.remove('active-laser');
                audioToggleBtn.classList.add('revealed', 'hologram-mode');

                const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');
                fullscreenToggleBtn.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 1200));
                fullscreenToggleBtn.classList.remove('active-laser');
                fullscreenToggleBtn.classList.add('revealed', 'hologram-mode');

                document.querySelector('header').style.opacity = '1';

                function ejecutarGlitchUnico(selector, delay) {
                    setTimeout(() => {
                        const el = document.querySelector(selector);
                        if (!el) return;
                        el.style.opacity = '1';
                        el.classList.add('glitch-slice-active');
                        setTimeout(() => {
                            el.classList.remove('glitch-slice-active');
                            el.classList.add('hologram-mode');
                        }, 350);
                    }, delay);
                }

                ejecutarGlitchUnico('.ecosistema-title', 200);
                ejecutarGlitchUnico('header h1', 700);
                ejecutarGlitchUnico('header p', 1200);

                setTimeout(async () => {
                    const mainFooter = document.getElementById('main-footer');
                    const footerText = document.getElementById('footer-text');
                    footerText.textContent = footerText.dataset.text.replace('2026', new Date().getFullYear());
                    mainFooter.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 1200));
                    mainFooter.classList.remove('active-laser');
                    mainFooter.classList.add('revealed', 'hologram-mode');
                }, 1600);
            }

            requestAnimationFrame(iniciarAnimaciones);
        }

        window.addEventListener('DOMContentLoaded', runEcosystemEntrance);

        // TRANSICIÓN DE SALIDA PARA EL RESTO DE ENLACES
        const allLinks = document.querySelectorAll('a[href]');
        allLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.id === 'audio-toggle' || this.id === 'fullscreen-toggle' || this.id === 'hotspot-box') return;
                const href = this.getAttribute('href');
                if (href.startsWith('#')) return;

                e.preventDefault(); 
                const targetUrl = this.href;

                document.body.classList.add('blurred-page');
                document.querySelectorAll('.top-bar, header, .container, #main-footer').forEach(el => {
                    el.style.transition = 'opacity 800ms ease';
                    el.style.opacity = '0';
                });
                document.getElementById('bg-layer').style.opacity = '0';
                document.getElementById('bg-top-layer').style.opacity = '0';
                document.getElementById('cursor-light-glow').style.opacity = '0';

                const overlay = document.getElementById('intro-overlay');
                overlay.style.zIndex = '40000';
                overlay.style.backgroundColor = '#000000';
                overlay.style.opacity = '1';

                setTimeout(() => { overlay.style.backgroundColor = '#ffffff'; }, 600);
                setTimeout(() => { window.location.href = targetUrl; }, 1200);
            });
        });
    </script>
</body>
</html>
